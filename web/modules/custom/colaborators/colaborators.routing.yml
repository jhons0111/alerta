colaborators.data:
  path: '/api/colaborators'
  defaults:
    _controller: '\Drupal\colaborators\Controller\ColaboratorsResource::get'
    _title: 'Colaborators Resource'
  methods: [GET]
  requirements:
    _permission: 'access content'

colaborator.data:
  path: '/api/colaborator/{node}'
  defaults:
    _controller: '\Drupal\colaborators\Controller\ColaboratorsResource::individualData'
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    _permission: 'access content'